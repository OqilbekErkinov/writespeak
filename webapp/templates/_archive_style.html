<style>
  /* The checks' archive (webapp/archive.py): the lists and the detail pages - on base.html's brand tokens */
  .a-top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
  .a-top .hint { margin: 6px 0 0; max-width: 720px; }
  .a-switch { display: inline-flex; padding: 4px; border-radius: 100px; background: var(--surface); border: 1px solid var(--border); }
  .a-switch a { padding: 7px 16px; border-radius: 100px; font-size: 13.5px; color: var(--ink-soft); }
  .a-switch a:hover { text-decoration: none; color: var(--ink); }
  .a-switch a.on { background: var(--ink); color: var(--lime); }
  .a-note { margin: 0 0 16px; padding: 11px 14px; border-radius: 12px; background: #FFF3BF; border-left: 4px solid var(--yellow);
    font-size: 14px; font-weight: 700; color: var(--ink); }
  .a-note.bad { background: var(--red-tint); border-left-color: var(--red); }

  /* the filters */
  .a-filter { padding: 16px 18px; margin-bottom: 14px; }
  .a-f-row { display: grid; grid-template-columns: minmax(220px, 2.2fr) repeat(5, minmax(120px, 1fr)); gap: 10px 12px; align-items: end; }
  .a-f-row label { display: grid; gap: 5px; min-width: 0; }
  .a-f-row label > span { font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--moss); }
  .a-f-row input[type=text], .a-f-row input[type=date] { width: 100%; }
  .a-filter input[type=date] { font-family: var(--font); font-size: 14px; font-weight: 600; padding: 8px 10px; border: 1px solid var(--border-strong);
    border-radius: 10px; background: var(--surface); color: var(--ink); min-height: 41px; }
  .a-filter input[type=date]:focus { outline: none; border-color: var(--moss); box-shadow: 0 0 0 3px rgba(91,242,166,0.45); }
  .a-f-row .dd { min-width: 0; }
  .a-f-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-top: 12px; }
  .a-f-foot .filters a { padding: 5px 12px; font-size: 12.5px; }
  .a-chk { display: inline-flex !important; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700; color: var(--ink-soft); cursor: pointer; }
  .a-chk input { width: 16px; height: 16px; }
  .a-f-btns { margin-left: auto; display: flex; gap: 8px; }

  .a-sum { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
  .a-sum div { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px; }
  .a-sum div:first-child { background: var(--ink); border-color: var(--ink); }
  .a-sum div:first-child b { color: var(--lime); }
  .a-sum div:first-child span { color: rgba(255,255,255,0.75); }
  .a-sum b { display: block; font: 700 20px/1.2 var(--font-head); color: var(--ink); letter-spacing: -0.02em; }
  .a-sum span { font-size: 12px; color: var(--ink-soft); }

  /* the list */
  .a-table { padding: 6px 8px; }
  .a-table td { vertical-align: top; }
  .a-table td.r, .a-table th.r { text-align: right; }
  .a-table .nowrap { white-space: nowrap; }
  .a-id { font-weight: 800; color: var(--ink); }
  .a-type b { color: var(--ink); white-space: nowrap; }
  .a-prompt { margin-top: 3px; max-width: 340px; font-size: 12.5px; color: var(--ink-faint); overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .a-tag { display: inline-block; margin-left: 4px; padding: 1px 7px; border-radius: 100px; background: var(--mint-2); border: 1px solid var(--border);
    font-size: 11px; font-weight: 800; color: var(--moss); white-space: nowrap; }
  .a-crit { display: flex; flex-wrap: nowrap; gap: 4px; }
  .a-cp { display: inline-flex; align-items: baseline; gap: 4px; padding: 1px 8px; border-radius: 100px; background: var(--paper);
    border: 1px solid var(--border); font: 800 12px/1.6 var(--font); color: var(--ink); white-space: nowrap; }
  .a-cp i { font-style: normal; font-size: 10px; letter-spacing: 0.04em; color: var(--ink-faint); }
  .a-icons { white-space: nowrap; font-size: 15px; letter-spacing: 2px; }
  .a-who .sub { display: block; }
  tr.row-link:hover td { background: var(--mint-2); }
  .a-pages { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 4px 0 8px; }
  .a-pages a, .a-pages span { min-width: 38px; padding: 7px 12px; border-radius: 100px; border: 1px solid var(--border-strong);
    background: var(--surface); text-align: center; font-size: 13.5px; color: var(--ink); }
  .a-pages span { border-color: transparent; background: none; color: var(--ink-faint); }
  .a-pages a:hover { text-decoration: none; border-color: var(--moss); background: var(--mint-2); }
  .a-pages a.on { background: var(--lime); border-color: var(--skin); }

  /* a check: its head */
  .a-nav { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin: -12px 0 14px; }
  .a-nav .a-step { display: flex; gap: 8px; }
  .a-hero { position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 26px; align-items: center;
    padding: 24px 26px; margin-bottom: 14px; border-radius: 22px; color: #fff;
    background: var(--ink) url(https://bandzilla.uz/assets/skin-ink.svg) 0 0 / 64px repeat; }
  .a-kind { font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--lime); }
  .a-hero h1 { margin: 6px 0 10px; color: #fff; font-size: 26px; }
  .a-hero h1 .muted { color: rgba(255,255,255,0.55); }
  .a-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .a-chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 100px; font-size: 12px; font-weight: 800;
    background: rgba(255,255,255,0.1); color: #fff; }
  .a-chip.y { background: var(--yellow); color: var(--ink); }
  .a-chip.g { background: var(--lime); color: var(--ink); }
  .a-hero a { color: var(--lime); }
  .a-student { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .a-student .ava { background: var(--lime); color: var(--ink); width: 44px; height: 44px; font-size: 16px; }
  .a-student b { display: block; font-size: 16px; color: #fff; }
  .a-student span { font-size: 13px; color: rgba(255,255,255,0.72); }
  .a-student span a { font-weight: 700; }
  .a-ring { display: grid; place-items: center; width: 132px; height: 132px; border-radius: 50%; text-align: center;
    background: radial-gradient(circle at center, var(--ink) 58%, transparent 59%), conic-gradient(var(--lime) var(--deg, 0deg), rgba(255,255,255,0.12) 0); }
  .a-ring b { display: block; font: 800 38px/1 var(--font-head); color: var(--lime); letter-spacing: -0.03em; }
  .a-ring span { display: block; margin-top: 4px; font-size: 10.5px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.6); }

  .a-crits { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
  .a-cr { padding: 14px 16px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); }
  .a-cr .k { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--moss); }
  .a-cr .b { margin: 2px 0; font: 800 28px/1.1 var(--font-head); color: var(--ink); letter-spacing: -0.02em; }
  .a-cr .nm { font-size: 12.5px; color: var(--ink-soft); line-height: 1.35; }
  .a-cr .tb { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); font-size: 12.5px; color: var(--ink-soft); }
  .a-cr .tb b { color: var(--ink); }
  .neg { color: #c2410c; } .pos { color: #1d4ed8; }

  .a-facts { display: flex; flex-wrap: wrap; gap: 1px; padding: 0; margin-bottom: 18px; overflow: hidden; background: var(--border); }
  .a-facts > div { flex: 1 1 210px; padding: 14px 20px; background: var(--surface); }
  .a-facts dt { font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--moss); }
  .a-facts dd { margin: 3px 0 0; font-size: 14px; color: var(--ink); line-height: 1.45; }
  .a-facts dd .muted { font-size: 12.5px; }

  .a-toc { position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; overflow-x: auto; padding: 10px 0; margin-bottom: 6px; background: var(--paper); }
  .a-toc a { white-space: nowrap; padding: 6px 12px; border-radius: 100px; border: 1px solid var(--border-strong); background: var(--surface);
    font-size: 13px; color: var(--ink); }
  .a-toc a:hover { text-decoration: none; border-color: var(--moss); }
  .a-toc a span { color: var(--ink-faint); margin-left: 3px; }

  .a-grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
  .a-grid .card { margin-bottom: 16px; scroll-margin-top: 64px; }
  .a-grid h2 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .a-grid h2 .muted { font: 700 12.5px/1.3 var(--font); }
  .a-grid h2 .btn { margin-left: auto; }
  .a-grid h3 { margin: 18px 0 8px; font: 800 14px/1.3 var(--font); color: var(--ink); }
  .a-text { white-space: pre-wrap; font-size: 15px; line-height: 1.7; overflow-wrap: anywhere; color: var(--ink); }
  .a-q { padding: 14px 16px; border-radius: 14px; background: var(--paper); border: 1px solid var(--border); }
  .a-essay { padding: 4px 2px; }
  .a-mk { background: #FFE8B3; color: var(--ink); border-radius: 4px; padding: 0 2px; box-shadow: inset 0 -2px 0 #E0A800; cursor: help; }
  .a-mk sup { margin-left: 2px; font-size: 10px; font-weight: 800; color: #8A6D00; }
  .a-pics { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 14px; }
  .a-pic { display: block; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); background: var(--paper); }
  .a-pic img { display: block; width: 100%; height: auto; max-height: 520px; object-fit: contain; }
  .a-pics.one { grid-template-columns: minmax(0, 720px); }
  .a-gone { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; padding: 11px 14px; border-radius: 12px; background: var(--paper);
    border: 1px dashed var(--border-strong); font-size: 13.5px; color: var(--ink-soft); }
  .a-key { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; font-size: 13.5px; color: var(--ink-soft); }

  .a-mist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .a-mist li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); }
  .a-n { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--lime); font: 800 12px/1 var(--font); }
  .a-fix { font-size: 14.5px; color: var(--ink); line-height: 1.5; }
  .a-fix s { color: #b42318; text-decoration-thickness: 2px; text-decoration-color: rgba(180,35,24,0.55); }
  .a-fix b { color: var(--moss); }
  .a-ct { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 100px; background: var(--mint); font: 800 10.5px/1.7 var(--font);
    letter-spacing: 0.04em; color: var(--ink); vertical-align: 1px; }
  .a-why { margin-top: 3px; font-size: 13.5px; color: var(--ink-soft); }
  .a-meant { margin-top: 3px; font-size: 13px; color: #8A6D00; }
  .a-old { font-size: 14px; color: var(--ink); padding-left: 10px; border-left: 3px solid var(--border-strong); }
  .a-old.green { border-left-color: var(--skin); } .a-old.yellow { border-left-color: var(--yellow); } .a-old.red { border-left-color: #E0A800; }

  .a-vocab td:first-child { font-weight: 800; color: var(--ink); white-space: nowrap; }
  .a-vocab td { vertical-align: top; font-size: 13.5px; }
  .a-sheet { margin-top: 6px; font-size: 13px; }
  .a-sheet th, .a-sheet td { padding: 6px 8px; }
  .a-sheet td.unsure { background: #FFF6D6; }
  .a-list { margin: 4px 0 0; padding-left: 20px; font-size: 13.5px; color: var(--ink-soft); }
  .a-list li { margin: 2px 0; }
  .a-dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: 13.5px; }
  .a-dl dt { color: var(--ink-soft); }
  .a-dl dd { margin: 0; color: var(--ink); font-weight: 700; text-align: right; }
  .a-btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .a-frame { margin-top: 14px; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); background: var(--paper); }
  .a-frame iframe { display: block; width: 100%; height: 80vh; border: 0; }
  .a-file { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 0; font-size: 13.5px; border-bottom: 1px solid var(--border); }
  .a-file:last-child { border-bottom: 0; }
  .a-comment { padding: 10px 12px; border-radius: 12px; background: var(--paper); margin-bottom: 8px; font-size: 13.5px; }
  .a-comment .muted { font-size: 12px; }

  /* Speaking */
  .a-audio { padding: 14px 16px; border-radius: 16px; background: var(--ink); }
  .a-audio audio { display: block; width: 100%; height: 44px; }
  .a-audio .a-ainfo { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12.5px; color: rgba(255,255,255,0.7); }
  .a-audio .a-ainfo a { color: var(--lime); }
  .a-qa { padding: 0; overflow: hidden; }
  .a-qa-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 14px 18px; background: var(--mint-2); border-bottom: 1px solid var(--border); }
  .a-qa-h .a-ql { display: grid; place-items: center; min-width: 38px; height: 28px; padding: 0 8px; border-radius: 100px; background: var(--ink); color: var(--lime);
    font: 800 12.5px/1 var(--font); }
  .a-qa-h .a-qp { font-size: 12px; font-weight: 800; color: var(--moss); letter-spacing: 0.05em; text-transform: uppercase; }
  .a-play { margin-left: auto; }
  .a-play + .a-play { margin-left: 0; }
  .a-qa-b { padding: 16px 18px; display: grid; gap: 14px; }
  .a-qa-b h3 { margin: 0 0 6px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--moss); }
  .a-said { padding: 12px 14px; border-left: 3px solid var(--skin); background: var(--surface); }
  .a-model { padding: 12px 14px; border-radius: 14px; background: #F5FBF8; border: 1px solid var(--border); }
  .a-model .a-text { font-size: 14.5px; }
  .a-model audio { width: 100%; margin-top: 10px; height: 38px; }
  .a-bars { display: grid; gap: 10px; }
  .a-bar { display: grid; grid-template-columns: 110px minmax(0, 1fr) 44px; align-items: center; gap: 10px; font-size: 13.5px; }
  .a-bar .t { height: 10px; border-radius: 100px; background: var(--paper); border: 1px solid var(--border); overflow: hidden; }
  .a-bar .t i { display: block; height: 100%; background: var(--skin); border-radius: 100px; }
  .a-bar .t i.lo { background: var(--yellow); }
  .a-bar b { text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }

  @media (max-width: 1100px) {
    .a-grid { grid-template-columns: 1fr; }
    .a-f-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .a-f-row .a-f-q { grid-column: 1 / -1; }
  }
  @media (max-width: 760px) {
    .a-hero { grid-template-columns: 1fr; padding: 20px 18px; }
    .a-ring { width: 108px; height: 108px; }
    .a-ring b { font-size: 30px; }
    .a-crits { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .a-sum { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .a-f-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .a-f-btns { margin-left: 0; width: 100%; }
    .a-f-btns .btn { flex: 1; text-align: center; }
  }
</style>
